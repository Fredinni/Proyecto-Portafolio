name: Pipeline and Live voice tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pytest -r requirements-voice.txt -r src/pfsense_pfctl_engine/requirements.txt
      - run: python -m pytest tests src/pfsense_setup/tests -q
      - run: bash -n infra/proxmox/services/deploy-live-voice.sh
