<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A11" />
    </radialGradient>

    <!-- Shield Facet Gradients -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="shieldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283548" />
      <stop offset="100%" stop-color="#131D2E" />
    </linearGradient>

    <!-- Core Sentinel Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleElevation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Technical Axis Guidelines (Minimal Grid) -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <line x1="400" y1="80" x2="400" y2="600" stroke-dasharray="4 8" />
    <circle cx="400" cy="340" r="220" fill="none" stroke-dasharray="2 6" />
    <circle cx="400" cy="340" r="260" fill="none" stroke-opacity="0.2" />
  </g>

  <!-- Monolithic Shield Entity -->
  <g filter="url(#subtleElevation)">
    <!-- Outer Shield Bezel -->
    <polygon points="400,100 580,180 540,440 400,560 260,440 220,180" 
             fill="none" stroke="#334155" stroke-width="2" />

    <!-- Left Shield Facet -->
    <polygon points="396,112 232,185 270,432 396,544" 
             fill="url(#shieldLeft)" stroke="#1E293B" stroke-width="1.5" />

    <!-- Right Shield Facet -->
    <polygon points="404,112 568,185 530,432 404,544" 
             fill="url(#shieldRight)" stroke="#334155" stroke-width="1.5" />

    <!-- Precision Central Seam -->
    <line x1="400" y1="112" x2="400" y2="544" stroke="#0F172A" stroke-width="4" />
    <line x1="400" y1="112" x2="400" y2="544" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Voice Telemetry Waveform Nodes (Lateral Bars) -->
  <g stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- Left Channel -->
    <line x1="310" y1="340" x2="310" y2="340" stroke-opacity="0.3" />
    <line x1="325" y1="320" x2="325" y2="360" />
    <line x1="340" y1="300" x2="340" y2="380" stroke-width="3.5" />
    <line x1="355" y1="315" x2="355" y2="365" />

    <!-- Right Channel -->
    <line x1="445" y1="315" x2="445" y2="365" />
    <line x1="460" y1="300" x2="460" y2="380" stroke-width="3.5" />
    <line x1="475" y1="320" x2="475" y2="360" />
    <line x1="490" y1="340" x2="490" y2="340" stroke-opacity="0.3" />
  </g>

  <!-- Central Optical Sentinel Iris (Autonomous Core) -->
  <g transform="translate(400, 340)">
    <!-- Base Core Ring -->
    <circle cx="0" cy="0" r="38" fill="#070A11" stroke="#1E293B" stroke-width="2" />
    <!-- Ambient Halo -->
    <circle cx="0" cy="0" r="30" fill="url(#coreGlow)" opacity="0.35" />
    <!-- Precision Aperture Ring -->
    <circle cx="0" cy="0" r="22" fill="#0B132B" stroke="#00E5FF" stroke-width="2" />
    <!-- Focal Diamond -->
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#00E5FF" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Threat Mitigation Node (Upper Crimson Indicator) -->
  <circle cx="400" cy="180" r="4" fill="#F43F5E" />
  <circle cx="400" cy="180" r="8" fill="none" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.5" />

  <!-- Modernist Typographic Block -->
  <text x="400" y="650" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" font-weight="700" letter-spacing="0.22em" fill="#F8FAFC" text-anchor="middle">
    KRONOS SENTINEL
  </text>
  
  <text x="400" y="678" font-family="'Geist Mono', 'SF Mono', 'Consolas', monospace" 
        font-size="10.5" font-weight="600" letter-spacing="0.18em" fill="#00E5FF" text-anchor="middle">
    AUTONOMOUS AI-IPS &#8226; LIVE VOICE SOAR &#8226; pfSense
  </text>

  <text x="400" y="704" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="9" font-weight="500" letter-spacing="0.08em" fill="#64748B" text-anchor="middle">
    DUOC UC SAN JOAQU&#205;N &#8226; INGENIER&#205;A EN CONECTIVIDAD Y REDES
  </text>
</svg>
