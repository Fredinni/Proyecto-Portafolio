<svg width="850" height="76" viewBox="0 0 850 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="line_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="848" height="74" rx="8" fill="url(#bg_grad)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left Accent Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 9 1 L 9 75 L 9 75 Q 1 75 1 67 Z" fill="#10B981"/>

  <!-- Badge Number -->
  <rect x="22" y="15" width="46" height="46" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.2" filter="url(#glow)"/>
  <text x="45" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle">08</text>

  <!-- Section Title -->
  <text x="82" y="36" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5">DESPLIEGUE Y PUESTA EN MARCHA RÁPIDA</text>

  <!-- Subtitle -->
  <text x="82" y="55" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" letter-spacing="0.8">GUÍA DE INICIALIZACIÓN DOCKER, ASTERISK & MOTOR PYTHON</text>

  <!-- Right Tag Pill -->
  <rect x="670" y="24" width="160" height="28" rx="14" fill="#0D1527" stroke="#1E293B" stroke-width="1"/>
  <circle cx="684" cy="38" r="4" fill="#10B981"/>
  <text x="696" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6">QUICKSTART GUIDE</text>

  <!-- Bottom Accent Gradient Line -->
  <rect x="10" y="73" width="830" height="2" rx="1" fill="url(#line_grad)"/>
</svg>