<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <!-- Modern Neutral Slate Surface Gradients -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="cardSurfaceHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151E2E" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>

    <!-- Subtle Elevation Shadow (Zero Cliché Glow) -->
    <filter id="subtleCardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#00E5FF" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#F59E0B" />
    </marker>
    <marker id="arrowCrimson" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#F43F5E" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#3B82F6" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#10B981" />
    </marker>
  </defs>

  <!-- Deep Slate Technical Canvas -->
  <rect width="1200" height="650" fill="#070A11" />

  <!-- Subtle Modular Technical Grid (40px) -->
  <g stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="40" y1="0" x2="40" y2="650" />
    <line x1="280" y1="0" x2="280" y2="650" />
    <line x1="580" y1="0" x2="580" y2="650" />
    <line x1="880" y1="0" x2="880" y2="650" />
    <line x1="1160" y1="0" x2="1160" y2="650" />
  </g>

  <!-- ================= MASTER HEADER ================= -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="-6" r="4" fill="#00E5FF" />
    <text x="14" y="-2" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.12em" fill="#F8FAFC">
      KRONOS SENTINEL
    </text>
    <text x="195" y="-2" font-family="'Geist Mono', 'SF Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.05em" fill="#64748B">
      // HIGH-PRECISION AUTONOMOUS IPS &amp; LIVE VOICE TELEMETRY TOPOLOGY
    </text>
    <text x="1080" y="-2" font-family="'Geist Mono', 'SF Mono', monospace" font-size="10" font-weight="600" fill="#10B981" text-anchor="end">
      &#9679; PRODUCTION SPECIFICATION v3.1
    </text>
  </g>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1E293B" stroke-width="1" />

  <!-- ================= ORTHOGONAL TELEMETRY BUS & CONNECTORS ================= -->
  <!-- Ingress to pfSense (WAN) -->
  <path d="M 230 195 L 290 195" stroke="#F43F5E" stroke-width="1.8" fill="none" marker-end="url(#arrowCrimson)" />
  <rect x="238" y="178" width="46" height="14" rx="2" fill="#18111A" stroke="#F43F5E" stroke-width="0.8" />
  <text x="261" y="188" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#F43F5E" text-anchor="middle">WAN IN</text>

  <!-- pfSense to HAProxy (LAN/DMZ) -->
  <path d="M 570 195 L 630 195" stroke="#00E5FF" stroke-width="1.8" fill="none" marker-end="url(#arrowCyan)" />
  <rect x="578" y="178" width="46" height="14" rx="2" fill="#0B1924" stroke="#00E5FF" stroke-width="0.8" />
  <text x="601" y="188" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#00E5FF" text-anchor="middle">DMZ L7</text>

  <!-- pfSense Netmap/Suricata down to pfctl Correlation Engine -->
  <path d="M 430 300 L 430 380" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowCyan)" />
  <rect x="440" y="328" width="86" height="18" rx="2" fill="#09131F" stroke="#1E293B" stroke-width="0.8" />
  <text x="483" y="340" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">eve.json + pfctl IPC</text>

  <!-- Correlation Engine to Asterisk Cloud PBX -->
  <path d="M 600 485 L 670 485" stroke="#F59E0B" stroke-width="1.8" fill="none" marker-end="url(#arrowAmber)" />
  <rect x="610" y="468" width="52" height="14" rx="2" fill="#1E160A" stroke="#F59E0B" stroke-width="0.8" />
  <text x="636" y="478" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#F59E0B" text-anchor="middle">REST HOOK</text>

  <!-- Asterisk PBX to CISO Mobile Receiver -->
  <path d="M 940 485 L 1000 485" stroke="#10B981" stroke-width="1.8" fill="none" marker-end="url(#arrowEmerald)" />
  <rect x="948" y="468" width="46" height="14" rx="2" fill="#0A1D16" stroke="#10B981" stroke-width="0.8" />
  <text x="971" y="478" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">SIP / GSM</text>

  <!-- ================= TOPOLOGY NODES / CARDS ================= -->

  <!-- CARD 01: EXTERNAL THREAT ORIGIN -->
  <g transform="translate(60, 100)" filter="url(#subtleCardShadow)">
    <rect width="170" height="200" rx="6" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1" />
    <rect width="170" height="3" rx="1" fill="#F43F5E" />
    
    <text x="16" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#F43F5E">01 / UNTRUSTED</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Threat Actor</text>
    <line x1="16" y1="56" x2="154" y2="56" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="10.5" fill="#CBD5E1">&#8226; SQL Injection Payloads</text>
    <text x="16" y="98" font-family="'Inter', sans-serif" font-size="10.5" fill="#CBD5E1">&#8226; Automated Scanners</text>
    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="10.5" fill="#CBD5E1">&#8226; Botnet Exploits</text>
    <text x="16" y="138" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748B">&#8226; Network Noise / FP</text>

    <!-- Badge -->
    <rect x="16" y="162" width="138" height="22" rx="3" fill="#18111A" stroke="#331924" stroke-width="1" />
    <text x="85" y="176" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#FDA4AF" text-anchor="middle">ATTACK INGRESS</text>
  </g>

  <!-- CARD 02: pfSense BORDER DEFENSE & IPS CORE -->
  <g transform="translate(290, 90)" filter="url(#subtleCardShadow)">
    <rect width="280" height="220" rx="6" fill="url(#cardSurfaceHighlight)" stroke="#2563EB" stroke-width="1.2" />
    <rect width="280" height="3" rx="1" fill="#00E5FF" />

    <text x="16" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#00E5FF">02 / PERIMETER IPS</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">pfSense Security Engine</text>
    <line x1="16" y1="56" x2="264" y2="56" stroke="#1E293B" stroke-width="1" />

    <!-- Sub-module 1 -->
    <rect x="16" y="68" width="248" height="34" rx="3" fill="#0B1320" stroke="#1E293B" stroke-width="0.8" />
    <text x="26" y="83" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">pfBlockerNG-devel</text>
    <text x="26" y="95" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">MaxMind GeoIP + Spamhaus / AbuseIPDB</text>

    <!-- Sub-module 2 -->
    <rect x="16" y="108" width="248" height="34" rx="3" fill="#0B1320" stroke="#1E293B" stroke-width="0.8" />
    <text x="26" y="123" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#00E5FF">Suricata Inline IPS (Netmap)</text>
    <text x="26" y="135" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">Live Packet Inspection &amp; eve.json Alert Stream</text>

    <!-- Sub-module 3 -->
    <rect x="16" y="148" width="248" height="34" rx="3" fill="#0B1320" stroke="#1E293B" stroke-width="0.8" />
    <text x="26" y="163" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">FreeBSD pfctl Kernel</text>
    <text x="26" y="175" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">Dynamic snort2c Table State Enforcement</text>

    <!-- Status indicator -->
    <circle cx="26" cy="199" r="3" fill="#10B981" />
    <text x="35" y="202" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#10B981">NETMAP BYPASS: ZERO LATENCY</text>
  </g>

  <!-- CARD 03: DMZ & REVERSE PROXY -->
  <g transform="translate(630, 100)" filter="url(#subtleCardShadow)">
    <rect width="210" height="200" rx="6" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1" />
    <rect width="210" height="3" rx="1" fill="#3B82F6" />

    <text x="16" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#3B82F6">03 / APPLICATION DMZ</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">HAProxy &amp; DVWA</text>
    <line x1="16" y1="56" x2="194" y2="56" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">HAProxy Reverse Proxy</text>
    <text x="16" y="93" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">SSL Termination &amp; Health Probe</text>

    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">DVWA Lab Container</text>
    <text x="16" y="133" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">Controlled SQLi Attack Surface</text>

    <rect x="16" y="156" width="178" height="24" rx="3" fill="#0A1424" stroke="#1E293B" stroke-width="1" />
    <text x="105" y="171" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#93C5FD" text-anchor="middle">DMZ ISOLATION: VLAN 50</text>
  </g>

  <!-- CARD 04: pfctl LOG CORRELATOR & FP SUPPRESSION (THE BRAIN) -->
  <g transform="translate(250, 390)" filter="url(#subtleCardShadow)">
    <rect width="350" height="205" rx="6" fill="url(#cardSurfaceHighlight)" stroke="#F59E0B" stroke-width="1.2" />
    <rect width="350" height="3" rx="1" fill="#F59E0B" />

    <text x="16" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#F59E0B">04 / INTELLIGENCE ENGINE</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">pfctl Correlator &amp; FP Filter</text>
    <line x1="16" y1="56" x2="334" y2="56" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="10.5" fill="#E2E8F0">&#8226; Continuous JSON tailing on <tspan font-family="'Geist Mono', monospace" fill="#00E5FF">/var/log/suricata/eve.json</tspan></text>
    <text x="16" y="98" font-family="'Inter', sans-serif" font-size="10.5" fill="#E2E8F0">&#8226; Heuristic payload verification (Eliminates &gt;50% FP)</text>
    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="10.5" fill="#E2E8F0">&#8226; Kernel validation: Cross-references <tspan font-family="'Geist Mono', monospace" fill="#FBBF24">pfctl -t snort2c -T show</tspan></text>

    <!-- Logic Evaluation Box -->
    <rect x="16" y="136" width="318" height="48" rx="3" fill="#141108" stroke="#382C10" stroke-width="1" />
    <text x="26" y="153" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#F59E0B">DECISION MATRIX:</text>
    <text x="26" y="169" font-family="'Geist Mono', monospace" font-size="8.5" fill="#E2E8F0">IF (Verified_SQLi == TRUE &amp;&amp; IP_in_snort2c) &#8594; <tspan fill="#10B981" font-weight="700">TRIGGER_SOAR</tspan></text>
  </g>

  <!-- CARD 05: CLOUD ASTERISK & GEMINI LIVE VOICE SOAR -->
  <g transform="translate(670, 390)" filter="url(#subtleCardShadow)">
    <rect width="270" height="205" rx="6" fill="url(#cardSurfaceHighlight)" stroke="#8B5CF6" stroke-width="1.2" />
    <rect width="270" height="3" rx="1" fill="#8B5CF6" />

    <text x="16" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#C4B5FD">05 / SOAR &amp; VOICE AI</text>
    <text x="16" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Asterisk &amp; Gemini Live 3.1</text>
    <line x1="16" y1="56" x2="254" y2="56" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#F1F5F9">Asterisk PBX (Docker Compose)</text>
    <text x="16" y="93" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">Auto-Dialer Engine &#8226; PJSIP Ext 1000</text>

    <text x="16" y="118" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#C4B5FD">Gemini Live API (Flash 3.1)</text>
    <text x="16" y="133" font-family="'Geist Mono', monospace" font-size="8.5" fill="#64748B">Real-time Bidirectional Audio Dialogue</text>

    <rect x="16" y="152" width="238" height="32" rx="3" fill="#130C22" stroke="#2D1B4E" stroke-width="1" />
    <text x="26" y="167" font-family="'Geist Mono', monospace" font-size="8.5" fill="#A78BFA">&#9679; Incident IP, Geolocation, SQLi Vector</text>
    <text x="26" y="177" font-family="'Geist Mono', monospace" font-size="8.5" fill="#A78BFA">&#9679; CISO Debrief &amp; Live Mitigation Q&amp;A</text>
  </g>

  <!-- CARD 06: HUMAN INCIDENT COMMAND / CISO -->
  <g transform="translate(1000, 390)" filter="url(#subtleCardShadow)">
    <rect width="140" height="205" rx="6" fill="url(#cardSurface)" stroke="#10B981" stroke-width="1" />
    <rect width="140" height="3" rx="1" fill="#10B981" />

    <text x="14" y="24" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.08em" fill="#10B981">06 / COMMAND</text>
    <text x="14" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">CISO Mobile</text>
    <line x1="14" y1="56" x2="126" y2="56" stroke="#1E293B" stroke-width="1" />

    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">&#8226; Live Phone Call</text>
    <text x="14" y="96" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">&#8226; Zero Latency</text>
    <text x="14" y="114" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">&#8226; Spoken Briefing</text>
    <text x="14" y="132" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">&#8226; Policy Approval</text>

    <rect x="14" y="156" width="112" height="24" rx="3" fill="#0A1D16" stroke="#133827" stroke-width="1" />
    <text x="70" y="171" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#6EE7B7" text-anchor="middle">CALL ACTIVE</text>
  </g>

  <!-- ================= FOOTER PROTOCOL MATRIX ================= -->
  <g transform="translate(60, 620)">
    <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">
      STACK: FreeBSD 15-CURRENT / pfSense CE &#8226; Suricata 7.0.x (Netmap Inline) &#8226; Asterisk 20 LTS &#8226; Google Gemini Live Flash 3.1 &#8226; HAProxy 2.8
    </text>
  </g>
</svg>
