<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="60%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1528" />
      <stop offset="100%" stop-color="#0D0A14" />
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1F33" />
      <stop offset="100%" stop-color="#06111D" />
    </linearGradient>

    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C261E" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>

    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261C0C" />
      <stop offset="100%" stop-color="#140E05" />
    </linearGradient>

    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201033" />
      <stop offset="100%" stop-color="#10081A" />
    </linearGradient>

    <linearGradient id="cardBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E20" />
      <stop offset="100%" stop-color="#041710" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circuit Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162238" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#FF1E56" />
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#00F5FF" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#F59E0B" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#A855F7" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1300" height="720" fill="url(#cyberBg)" />
  <rect width="1300" height="720" fill="url(#gridPattern)" />

  <!-- Outer Cyber Frame -->
  <rect x="20" y="20" width="1260" height="680" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="25" y="25" width="1250" height="670" rx="10" fill="none" stroke="#00F5FF" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="20 40 80 40" />

  <!-- ================= TOP BANNER HEADER ================= -->
  <g transform="translate(650, 52)">
    <text x="0" y="0" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="900" 
          letter-spacing="6" fill="#FFFFFF" text-anchor="middle">
      KRONOS SENTINEL : TOPOLOG&#205;A DE DEFENSA Y TELEMETR&#205;A
    </text>
    <text x="0" y="24" font-family="'Consolas', monospace" font-size="13" font-weight="bold" 
          letter-spacing="3" fill="#00F5FF" text-anchor="middle" filter="url(#glowCyan)">
      INLINE IPS NETMAP &#8226; MOTOR pfctl ANTIRUIDO &#8226; AGENTE DE VOZ IA GEMINI LIVE &#8226; ASTERISK PBX
    </text>
  </g>
  <line x1="60" y1="88" x2="1240" y2="88" stroke="#1E293B" stroke-width="2" />
  <line x1="450" y1="88" x2="850" y2="88" stroke="#00F5FF" stroke-width="2.5" filter="url(#glowCyan)" />

  <!-- ================= CONNECTOR PIPELINES & LABELS ================= -->
  
  <!-- Pipe 1: Threat to pfSense -->
  <path d="M 230 215 L 290 215" stroke="#FF1E56" stroke-width="3.5" fill="none" marker-end="url(#arrowRed)" filter="url(#glowRed)" />
  <rect x="235" y="185" width="52" height="20" rx="4" fill="#2A0812" stroke="#FF1E56" stroke-width="1.2" />
  <text x="261" y="199" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#FF809B" text-anchor="middle">WAN IN</text>

  <!-- Pipe 2: pfSense to HAProxy DMZ -->
  <path d="M 600 215 L 670 215" stroke="#00F5FF" stroke-width="3.5" fill="none" marker-end="url(#arrowCyan)" filter="url(#glowCyan)" />
  <rect x="610" y="185" width="55" height="20" rx="4" fill="#061B2E" stroke="#00F5FF" stroke-width="1.2" />
  <text x="637" y="199" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#00F5FF" text-anchor="middle">DMZ L7</text>

  <!-- Pipe 3: pfSense down to pfctl Correlation Engine -->
  <path d="M 445 335 L 445 405" stroke="#00F5FF" stroke-width="3.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowCyan)" filter="url(#glowCyan)" />
  <rect x="455" y="355" width="145" height="24" rx="4" fill="#081829" stroke="#00F5FF" stroke-width="1.2" />
  <text x="527" y="371" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">eve.json + pfctl IPC</text>

  <!-- Pipe 4: Correlation Engine to Asterisk Cloud PBX -->
  <path d="M 620 520 L 700 520" stroke="#F59E0B" stroke-width="3.5" fill="none" marker-end="url(#arrowAmber)" filter="url(#glowAmber)" />
  <rect x="630" y="490" width="60" height="20" rx="4" fill="#2E1B06" stroke="#F59E0B" stroke-width="1.2" />
  <text x="660" y="504" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">SOAR HOOK</text>

  <!-- Pipe 5: Asterisk PBX to CISO Receiver -->
  <path d="M 980 520 L 1050 520" stroke="#10B981" stroke-width="3.5" fill="none" marker-end="url(#arrowGreen)" />
  <rect x="985" y="490" width="60" height="20" rx="4" fill="#062618" stroke="#10B981" stroke-width="1.2" />
  <text x="1015" y="504" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">SIP / GSM</text>

  <!-- ================= TOPOLOGY CARDS (LARGE HIGH-CONTRAST TEXT) ================= -->

  <!-- CARD 01: ORIGEN DE AMENAZAS (WAN) -->
  <g transform="translate(50, 110)">
    <rect width="180" height="225" rx="10" fill="url(#cardBg1)" stroke="#FF1E56" stroke-width="2" filter="url(#glowRed)" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 38 L 0 38 Z" fill="#7A0022" />
    <text x="90" y="25" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01. AMENAZA WAN</text>

    <!-- Bullets -->
    <text x="16" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FF809B">&#8226; Inyecciones SQLi</text>
    <text x="16" y="90" font-family="'Segoe UI', sans-serif" font-size="13" fill="#F1F5F9">&#8226; Escaneos y Fuzzing</text>
    <text x="16" y="115" font-family="'Segoe UI', sans-serif" font-size="13" fill="#F1F5F9">&#8226; Exploits Automatizados</text>
    <text x="16" y="140" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">&#8226; Ruido Masivo / Bots</text>

    <!-- Sub-badge -->
    <rect x="15" y="170" width="150" height="36" rx="6" fill="#24050E" stroke="#FF1E56" stroke-width="1.5" />
    <text x="90" y="193" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#FF4D6D" text-anchor="middle">IP EXTERNA HOSTIL</text>
  </g>

  <!-- CARD 02: PERÍMETRO pfSense & SURICATA IPS -->
  <g transform="translate(290, 100)">
    <rect width="310" height="235" rx="10" fill="url(#cardBg2)" stroke="#00F5FF" stroke-width="2" filter="url(#glowCyan)" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 300 0 Q 310 0 310 10 L 310 40 L 0 40 Z" fill="#00599C" />
    <text x="155" y="26" font-family="'Orbitron', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02. FIREWALL pfSense CE</text>

    <!-- Submodule 1 -->
    <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#00F5FF">1. pfBlockerNG-devel + MaxMind</text>
    <text x="32" y="86" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Filtro GeoIP + Feeds (FireHOL / Spamhaus)</text>

    <!-- Submodule 2 -->
    <text x="18" y="114" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#00F5FF">2. Suricata Inline IPS (Netmap)</text>
    <text x="32" y="134" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Drop en Ring Buffer + Alertas a eve.json</text>

    <!-- Submodule 3 -->
    <text x="18" y="162" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#00F5FF">3. Tabla snort2c (Kernel pfctl)</text>
    <text x="32" y="182" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Bloqueo Dinámico e Inmediato de IPs</text>

    <!-- Status Tag -->
    <rect x="18" y="198" width="274" height="24" rx="4" fill="#041B2D" stroke="#00F5FF" stroke-width="1" />
    <text x="155" y="215" font-family="'Consolas', monospace" font-size="11.5" font-weight="bold" fill="#10B981" text-anchor="middle">&#10004; MODO IPS ACTIVO SIN LATENCIA</text>
  </g>

  <!-- CARD 03: DMZ HAProxy & DVWA LAB -->
  <g transform="translate(670, 110)">
    <rect width="250" height="225" rx="10" fill="url(#cardBg3)" stroke="#10B981" stroke-width="2" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 38 L 0 38 Z" fill="#046A38" />
    <text x="125" y="25" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03. DMZ &amp; DVWA</text>

    <!-- Submodules -->
    <text x="16" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#34D399">HAProxy Reverse Proxy</text>
    <text x="16" y="86" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Terminación SSL + Stick-Tables</text>
    <text x="16" y="106" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Rate-Limiting (Anti-Fuzzing)</text>

    <text x="16" y="136" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">DVWA Web Container</text>
    <text x="16" y="156" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Objetivo Vulnerable de Prueba</text>

    <!-- Sub-badge -->
    <rect x="15" y="174" width="220" height="32" rx="5" fill="#021C11" stroke="#10B981" stroke-width="1.2" />
    <text x="125" y="195" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#6EE7B7" text-anchor="middle">VLAN 20 AISLADA</text>
  </g>

  <!-- CARD 04: MOTOR pfctl CORRELATOR (EL CEREBRO) -->
  <g transform="translate(230, 405)">
    <rect width="390" height="235" rx="10" fill="url(#cardBg4)" stroke="#F59E0B" stroke-width="2" filter="url(#glowAmber)" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 380 0 Q 390 0 390 10 L 390 40 L 0 40 Z" fill="#92400E" />
    <text x="195" y="26" font-family="'Orbitron', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04. MOTOR pfctl CORRELATOR</text>

    <!-- Text items with high contrast -->
    <text x="18" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">&#8226; Parser Continuo de eve.json (Suricata)</text>
    <text x="18" y="94" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#34D399">&#8226; Supresi&#243;n de Falsos Positivos (&gt;50%)</text>
    <text x="36" y="114" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#CBD5E1">Filtro heur&#237;stico de SQLi, RCE y descarte de ruido</text>
    <text x="18" y="140" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#38BDF8">&#8226; Verificaci&#243;n At&#243;mica en Kernel pfctl</text>
    <text x="36" y="160" font-family="'Consolas', monospace" font-size="12" fill="#F8FAFC">pfctl -t snort2c -T test &lt;IP&gt; == 0</text>

    <!-- Decision Formula Box -->
    <rect x="18" y="174" width="354" height="46" rx="6" fill="#1C1103" stroke="#F59E0B" stroke-width="1.5" />
    <text x="195" y="193" font-family="'Consolas', monospace" font-size="11.5" font-weight="bold" fill="#FDE68A" text-anchor="middle">SI (SQLi_Confirmado &amp;&amp; IP_in_snort2c):</text>
    <text x="195" y="210" font-family="'Consolas', monospace" font-size="11.5" font-weight="bold" fill="#10B981" text-anchor="middle">&#8680; DISPARAR LLAMADA TELEF&#211;NICA DE EMERGENCIA</text>
  </g>

  <!-- CARD 05: SOAR VOZ IA & ASTERISK PBX -->
  <g transform="translate(700, 405)">
    <rect width="280" height="235" rx="10" fill="url(#cardBg5)" stroke="#A855F7" stroke-width="2" filter="url(#glowPurple)" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 40 L 0 40 Z" fill="#6B21A8" />
    <text x="140" y="26" font-family="'Orbitron', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">05. VOZ IA &amp; ASTERISK PBX</text>

    <!-- Submodules -->
    <text x="16" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#D8B4FE">1. Asterisk PBX (Docker)</text>
    <text x="30" y="88" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Auto-Dialer AMI / Troncal SIP 1000</text>

    <text x="16" y="118" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#00F5FF">2. Gemini Live API Flash 3.1</text>
    <text x="30" y="138" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Streaming Bidireccional de Audio</text>

    <text x="16" y="168" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#F43F5E">3. Debriefing T&#225;ctico</text>
    <text x="30" y="188" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">IP Atacante, Pa&#237;s, Vector SQLi y Mitigaci&#243;n</text>

    <!-- Active Call Badge -->
    <rect x="16" y="198" width="248" height="24" rx="4" fill="#1C0933" stroke="#A855F7" stroke-width="1" />
    <text x="140" y="215" font-family="'Consolas', monospace" font-size="11.5" font-weight="bold" fill="#E9D5FF" text-anchor="middle">&#128222; LLAMADA EN TIEMPO REAL</text>
  </g>

  <!-- CARD 06: CISO / LEAD SOC -->
  <g transform="translate(1050, 420)">
    <rect width="180" height="205" rx="10" fill="url(#cardBg6)" stroke="#10B981" stroke-width="2" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 38 L 0 38 Z" fill="#065F46" />
    <text x="90" y="25" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">06. CISO / SOC</text>

    <text x="16" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#34D399">&#8226; Llamada Telef&#243;nica</text>
    <text x="16" y="93" font-family="'Segoe UI', sans-serif" font-size="13" fill="#F1F5F9">&#8226; Cero Latencia</text>
    <text x="16" y="118" font-family="'Segoe UI', sans-serif" font-size="13" fill="#F1F5F9">&#8226; Di&#225;logo con la IA</text>
    <text x="16" y="143" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">&#8226; Aprobaci&#243;n T&#225;ctica</text>

    <!-- Status -->
    <rect x="15" y="160" width="150" height="32" rx="5" fill="#062618" stroke="#10B981" stroke-width="1.2" />
    <text x="90" y="181" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#A7F3D0" text-anchor="middle">&#128241; CISO AL TEL&#201;FONO</text>
  </g>

  <!-- ================= FOOTER ================= -->
  <g transform="translate(650, 680)">
    <text x="0" y="0" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#64748B" text-anchor="middle">
      KRONOS SENTINEL &#8226; DUOC UC SEDE SAN JOAQU&#205;N &#8226; INGENIER&#205;A EN CONECTIVIDAD Y REDES (APT122)
    </text>
  </g>
</svg>
