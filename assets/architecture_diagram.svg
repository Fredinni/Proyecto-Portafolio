<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E56" />
      <stop offset="100%" stop-color="#990033" />
    </linearGradient>
    <linearGradient id="cyanBoxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="#06090F" />
  
  <!-- Title -->
  <text x="600" y="45" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    KRONOS SENTINEL: ARQUITECTURA DE DEFENSAS Y RESPUESTA POR VOZ IA
  </text>
  <text x="600" y="70" font-family="monospace" font-size="12" fill="#00F5FF" text-anchor="middle" letter-spacing="2">
    FLUJO DE TELEMETRÍA EN TIEMPO REAL &bull; FILTRADO DE FALSOS POSITIVOS &bull; DISPARO DE LLAMADA AL CISO
  </text>

  <!-- 1. Attacker Box -->
  <g transform="translate(50, 120)">
    <rect width="180" height="150" rx="10" fill="url(#boxGrad)" stroke="#FF1E56" stroke-width="2" filter="url(#glow)" />
    <rect width="180" height="35" rx="10" fill="url(#headerGrad)" />
    <text x="90" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">AMENAZA EXTERNA</text>
    <text x="90" y="65" font-family="monospace" font-size="11" fill="#FF809B" text-anchor="middle">&bull; SQL Injection (SQLi)</text>
    <text x="90" y="85" font-family="monospace" font-size="11" fill="#FF809B" text-anchor="middle">&bull; Exploit Payloads</text>
    <text x="90" y="105" font-family="monospace" font-size="11" fill="#FF809B" text-anchor="middle">&bull; Port Scanners / Noise</text>
    <text x="90" y="130" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">[ WAN Interface ]</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 195 L 290 195" stroke="#FF1E56" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <polygon points="290,195 280,190 280,200" fill="#FF1E56" />

  <!-- 2. pfSense Box -->
  <g transform="translate(300, 100)">
    <rect width="250" height="200" rx="10" fill="url(#boxGrad)" stroke="#00F5FF" stroke-width="2" filter="url(#glow)" />
    <rect width="250" height="35" rx="10" fill="url(#cyanBoxGrad)" />
    <text x="125" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">FIREWALL pfSense CE</text>
    <text x="125" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F5FF" text-anchor="middle">1. pfBlockerNG-devel</text>
    <text x="125" y="82" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">MaxMind GeoIP + Threat Feeds</text>
    <text x="125" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F5FF" text-anchor="middle">2. Suricata (Inline IPS / Netmap)</text>
    <text x="125" y="122" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Packet Drop &amp; eve.json Alerting</text>
    <text x="125" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00F5FF" text-anchor="middle">3. FreeBSD pfctl State Table</text>
    <text x="125" y="162" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">snort2c Dynamic Drop List</text>
    <text x="125" y="185" font-family="monospace" font-size="10" fill="#10B981" text-anchor="middle">[ Active Drop State ]</text>
  </g>

  <!-- Arrow 2 -> 3 (HAProxy / DVWA) -->
  <path d="M 550 195 L 610 195" stroke="#00F5FF" stroke-width="3" fill="none" />
  <polygon points="610,195 600,190 600,200" fill="#00F5FF" />

  <!-- 3. HAProxy & DVWA Box -->
  <g transform="translate(620, 120)">
    <rect width="200" height="150" rx="10" fill="url(#boxGrad)" stroke="#10B981" stroke-width="2" />
    <rect width="200" height="35" rx="10" fill="#10B981" />
    <text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">DMZ &amp; APLICACIÓN</text>
    <text x="100" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">HAProxy Reverse Proxy</text>
    <text x="100" y="82" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">SSL Term / Health Checks</text>
    <text x="100" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F59E0B" text-anchor="middle">DVWA Lab Container</text>
    <text x="100" y="125" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Entorno Vulnerable Controlado</text>
  </g>

  <!-- Downward Line from pfSense to pfctl Correlation Engine -->
  <path d="M 425 300 L 425 380" stroke="#00F5FF" stroke-width="3" stroke-dasharray="6 4" fill="none" />
  <polygon points="425,380 420,370 430,370" fill="#00F5FF" />

  <!-- 4. pfctl Correlation Engine Box -->
  <g transform="translate(250, 390)">
    <rect width="350" height="210" rx="10" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#glow)" />
    <rect width="350" height="35" rx="10" fill="#D97706" />
    <text x="175" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">MOTOR LOG CORRELATOR (pfctl + EVE)</text>
    <text x="175" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">&bull; Supresión de Falsos Positivos (>50%)</text>
    <text x="175" y="85" font-family="sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">&bull; Análisis Heurístico de Payload SQLi</text>
    <text x="175" y="105" font-family="sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">&bull; Validación en Tabla `snort2c` de pfctl</text>
    <text x="175" y="125" font-family="sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">&bull; Verificación de Ataque Real Confirmado</text>
    <rect x="30" y="145" width="290" height="45" rx="5" fill="#1E293B" />
    <text x="175" y="163" font-family="monospace" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">SI (SQLi Confirmado &amp;&amp; IP_Blocked):</text>
    <text x="175" y="178" font-family="monospace" font-size="10" fill="#00F5FF" text-anchor="middle">Disparar Webhook de Emergencia a PBX</text>
  </g>

  <!-- Arrow 4 -> 5 (Asterisk & Gemini Voice Agent) -->
  <path d="M 600 495 L 680 495" stroke="#F59E0B" stroke-width="3" fill="none" />
  <polygon points="680,495 670,490 670,500" fill="#F59E0B" />

  <!-- 5. Asterisk + Gemini Live Voice Agent Box -->
  <g transform="translate(690, 390)">
    <rect width="250" height="210" rx="10" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)" />
    <rect width="250" height="35" rx="10" fill="#7C3AED" />
    <text x="125" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">VOZ IA &amp; CLOUD ASTERISK</text>
    <text x="125" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A78BFA" text-anchor="middle">1. Asterisk PBX (Docker)</text>
    <text x="125" y="82" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Auto-Dialer SIP / ARI Bridge</text>
    <text x="125" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A78BFA" text-anchor="middle">2. Gemini Live API Flash 3.1</text>
    <text x="125" y="122" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Agente de Voz Bidireccional</text>
    <text x="125" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A78BFA" text-anchor="middle">3. Debriefing &amp; Mitigaciones</text>
    <text x="125" y="162" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">IP, País, Vector y Telemetría</text>
    <text x="125" y="188" font-family="monospace" font-size="10" fill="#00F5FF" text-anchor="middle">[ Llamada Telefónica Activa ]</text>
  </g>

  <!-- Arrow 5 -> 6 (CISO / SOC Lead) -->
  <path d="M 940 495 L 1010 495" stroke="#8B5CF6" stroke-width="3" fill="none" />
  <polygon points="1010,495 1000,490 1000,500" fill="#8B5CF6" />

  <!-- 6. CISO / Operador SOC -->
  <g transform="translate(1020, 420)">
    <rect width="140" height="150" rx="10" fill="url(#boxGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)" />
    <rect width="140" height="35" rx="10" fill="#059669" />
    <text x="70" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">CISO / SOC LEAD</text>
    <text x="70" y="65" font-family="sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Recepción de</text>
    <text x="70" y="82" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">Llamada de Voz</text>
    <text x="70" y="110" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Interacción en vivo</text>
    <text x="70" y="125" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">con Agente de IA</text>
  </g>
</svg>
