# ==============================================================================
# KRONOS SENTINEL - HAProxy Hardened Configuration
# Reverse Proxy, SSL Offloading, Advanced Stick-Tables & Header Sanitization
# ==============================================================================

global
    log /dev/log local0 info
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon

    # Criptografía SSL/TLS Hardened (TLS 1.2 y 1.3 exclusivamente)
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    
    # Timeouts reforzados contra Slowloris y Slow POST
    timeout http-request    5000ms
    timeout http-keep-alive 10000ms
    timeout connect         5000ms
    timeout client          30000ms
    timeout server          30000ms
    timeout queue           5000ms

# --- FRONTEND WAN (Exposed to Public Network / Suricata Ingress) ---
frontend fe_kronos_wan
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/kronos_wildcard.pem alpn h2,http/1.1
    
    # 1. Redirección forzosa HTTP -> HTTPS
    http-request redirect scheme https code 301 unless { ssl_fc }

    # 2. Ocultación y Sanitización de Cabeceras
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]

    # 3. Security Headers en Respuestas
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response del-header Server
    http-response del-header X-Powered-By

    # --------------------------------------------------------------------------
    # STICK TABLES: Control de Concurrencia, Escaneos y DoS
    # --------------------------------------------------------------------------
    
    # Tabla 1: Control de Conexiones TCP
    stick-table type ip size 100k expire 1m store conn_cur,conn_rate(3s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 20 }
    tcp-request connection reject if { sc_conn_rate(0) gt 30 }

    # Tabla 2: Tasa Global de Peticiones y Detección de Errores (Fuzzing/Scanners)
    stick-table type ip size 100k expire 2m store http_req_rate(10s),http_err_rate(10s)
    http-request track-sc1 src
    
    # Bloqueo por exceso de peticiones HTTP (HTTP Flood > 80 req / 10s)
    http-request deny deny_status 429 if { sc_http_req_rate(1) gt 80 }
    
    # Bloqueo por escáner de vulnerabilidades (Fuzzing > 25 errores 4xx / 10s)
    http-request deny deny_status 429 if { sc_http_err_rate(1) gt 25 }

    # Tabla 3: Protección de Endpoints Críticos (Fuerza Bruta en Login)
    stick-table type ip size 50k expire 5m store http_req_rate(10s)
    acl is_login_endpoint path_beg -i /login.php /vulnerabilities/brute/
    http-request track-sc2 src if is_login_endpoint
    http-request deny deny_status 429 if is_login_endpoint { sc_http_req_rate(2) gt 5 }

    # Inyección de cabecera Retry-After en respuestas 429
    http-response set-header Retry-After 60 if { status 429 }

    # Enrutar al backend de la DMZ
    default_backend bk_dvwa_dmz

# --- BACKEND DMZ (Target Vulnerable Web App) ---
backend bk_dvwa_dmz
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header Host %[req.hdr(Host)]
    
    # Health Check activo con validación de estado HTTP
    option httpchk GET /login.php
    http-check expect status 200,302
    server dvwa_node1 192.168.100.50:80 check inter 3000ms fall 3 rise 2
