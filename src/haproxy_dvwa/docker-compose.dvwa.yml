version: '3.8'

services:
  dvwa_target:
    image: vulnerables/web-dvwa:latest
    container_name: kronos_dvwa_dmz
    restart: unless-stopped
    ports:
      - "192.168.100.50:80:80"
    environment:
      - MYSQL_PASS=KRONOS_SecOps_DMZ_2026!
    # Hardening de Contenedor en DMZ
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /var/log/apache2:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
          pids: 100
    networks:
      dmz_net:
        ipv4_address: 192.168.100.50

networks:
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
