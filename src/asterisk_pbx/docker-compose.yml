# Basic PBX only. For the complete Live agent use compose.voip.yml + compose.live.yml
# as documented in docs/GEMINI_LIVE_OPERACION.md.

services:
  kronos_asterisk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kronos_asterisk_pbx
    restart: unless-stopped
    network_mode: "host" # Para evitar problemas de NAT en RTP y SIP
    environment:
      - TZ=America/Santiago
    volumes:
      - ${ASTERISK_CONFIG_DIR:?Set ASTERISK_CONFIG_DIR}/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ${ASTERISK_CONFIG_DIR:?Set ASTERISK_CONFIG_DIR}/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ${ASTERISK_CONFIG_DIR:?Set ASTERISK_CONFIG_DIR}/manager.conf:/etc/asterisk/manager.conf:ro
      - ${ASTERISK_CONFIG_DIR:?Set ASTERISK_CONFIG_DIR}/rtp.conf:/etc/asterisk/rtp.conf:ro
      - asterisk_spool:/var/spool/asterisk/outgoing
      - asterisk_logs:/var/log/asterisk

volumes:
  asterisk_spool:
  asterisk_logs:
