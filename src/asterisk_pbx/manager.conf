; ==============================================================================
; KRONOS SENTINEL - Asterisk Manager Interface (manager.conf)
; Project: Autonomous AI-IPS & Live Voice Incident Response (APT122 - Duoc UC)
; ==============================================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes
webenabled = no
timestampevents = yes

; Usuario operativo para el motor KRONOS y despachador de alertas
[kronos_ami]
secret = KronosSecOps2026!
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 192.168.0.0/255.255.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
read = system,call,log,verbose,command,agent,user,config
write = system,call,log,verbose,command,agent,user,config,originate
