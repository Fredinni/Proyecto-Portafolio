; ==============================================================================
; KRONOS SENTINEL - Asterisk Dialplan (extensions.conf)
; Project: Autonomous AI-IPS & Live Voice Incident Response (APT122 - Duoc UC)
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RING_TIMEOUT=25
MAX_CALL_DURATION=300

; ==============================================================================
; Context: kronos-internal (Llamadas entre operadores y acceso directo al bot)
; ==============================================================================
[kronos-internal]

; --- Anexo 1000: Agente IA KRONOS (Gemini Live Audio Bridge) ---
exten => 1000,1,NoOp(--- LLAMADA ENTRANTE AL AGENTE IA KRONOS (1000) ---)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Playback(custom/kronos_alert)
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_DURATION})
 same => n,EAGI(/usr/local/bin/gemini_audio_bridge.py,DIRECT_CALL,${CALLERID(num)},INTERNAL)
 same => n,Hangup()

; --- Anexo 1001: Bruno Urrea Ortiz (CISO / SecOps Lead) ---
exten => 1001,1,NoOp(Llamando a Bruno Urrea (CISO)...)
 same => n,Dial(PJSIP/1001,${RING_TIMEOUT})
 same => n,Hangup()

; --- Anexo 1002: Freddy Vasquez Cortes (VoIP & Network Engineer) ---
exten => 1002,1,NoOp(Llamando a Freddy Vasquez...)
 same => n,Dial(PJSIP/1002,${RING_TIMEOUT})
 same => n,Hangup()

; --- Anexo 1003: Cristobal Quezada (DMZ & Proxy Admin) ---
exten => 1003,1,NoOp(Llamando a Cristobal Quezada...)
 same => n,Dial(PJSIP/1003,${RING_TIMEOUT})
 same => n,Hangup()

; --- Anexo 1004: Kevin Retamales (Threat Intel & Hardening) ---
exten => 1004,1,NoOp(Llamando a Kevin Retamales...)
 same => n,Dial(PJSIP/1004,${RING_TIMEOUT})
 same => n,Hangup()

; --- Grupo de Emergencia SOC (Timbra a todo el equipo simultáneamente) ---
exten => 9999,1,NoOp(--- ALERTA GLOBAL SOC: LLAMANDO A TODOS LOS OPERADORES ---)
 same => n,Dial(PJSIP/1001&PJSIP/1002&PJSIP/1003&PJSIP/1004,30)
 same => n,Hangup()

; --- Anexo 7777: Test de Audio KRONOS Alert ---
exten => 7777,1,NoOp(--- PRUEBA DIRECTA DE AUDIO KRONOS ---)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Playback(custom/kronos_alert)
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Hangup()

; --- Anexo 8888: Echo Test de Audio ---
exten => 8888,1,NoOp(--- ECHO TEST DE AUDIO ---)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

; ==============================================================================
; Context: kronos-emergency-response (Disparado automáticamente por pfctl Engine)
; ==============================================================================
[kronos-emergency-response]
exten => s,1,NoOp(--- KRONOS EMERGENCY TRIGGER: CISO RESPONDIO LA LLAMADA ---)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(absolute)=180) ; 3 minutos de canal tactico
 same => n,NoOp(Iniciando agente de voz Gemini Live para ${INCIDENT_TYPE} de ${ATTACKER_IP})
 same => n,EAGI(/usr/local/bin/gemini_audio_bridge.py,${INCIDENT_TYPE},${ATTACKER_IP},${GEO_ORIGIN})
 same => n,Hangup()
